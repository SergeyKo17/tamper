name: Release

on:
  push:
    tags: ['v*']

# Read-only by default; each job raises only what it needs.
permissions:
  contents: read

jobs:
  # A release cannot be withdrawn once it is out, and a tag may sit on a commit
  # that PR checks never saw. So the tag is tested before anything is uploaded.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: Test
        run: go test -race ./...

  binaries:
    name: Binaries
    runs-on: ubuntu-latest
    needs: test
    permissions:
      # A release is an object in the repository itself, and goreleaser creates
      # it and uploads into it.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser derives the version from the tag and the changelog from
          # the commits since the previous one. On a shallow clone it finds
          # neither and falls back to a snapshot version.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: Release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Image
    runs-on: ubuntu-latest
    # The image follows the release rather than racing it: a failed release
    # must not leave a tag in the registry with no release page behind it.
    needs: binaries
    permissions:
      # Packages are a subsystem of their own, with their own scope.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A plain docker build produces one image for the runner's own
      # architecture. buildx builds both and joins them under a single tag.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The workflow token doubles as the registry password; no secret of
          # our own is involved.
          password: ${{ secrets.GITHUB_TOKEN }}
      # Turns the tag into image tags and OCI labels. The source label is what
      # links the package to this repository.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # latest moves only for a tag that is not a pre-release.
          flavor: latest=auto
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          # No QEMU: the build stage stays on the runner's architecture and Go
          # cross-compiles from there.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The build context carries no git repository, so the version has to
          # be handed in. meta reports 0.1.0 for the tag v0.1.0.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}

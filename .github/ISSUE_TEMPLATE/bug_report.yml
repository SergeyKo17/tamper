name: Bug report
description: tamper behaves differently from what the README describes
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in enough for someone to reproduce
        the problem without asking follow-up questions.

  - type: input
    id: version
    attributes:
      label: tamper version
      description: Release tag, or the commit you built from.
      placeholder: v0.2.0, or 2eb894b
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Go version and OS
      description: Output of `go version`, plus your operating system.
      placeholder: go1.26.0 linux/amd64
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: >
        The tamper.yml you ran with. Remove certificates, hostnames and
        anything else you would rather not publish.
      render: yaml
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you ran, and against what kind of service.
      placeholder: |
        1. Start tamper with the config above
        2. Call /myapp.UserService/GetUser through it
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Include the client-side error if there was one.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: tamper output
      description: Relevant log lines. Set `logger.level` to `debug` for more.
      render: shell
    validations:
      required: false

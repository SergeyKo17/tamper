# Side facing gRPC clients: tamper is the server here.
listen:
  addr: ":9090"
  # Serve TLS to clients. Without this block the listener is plaintext.
  # tls:
  #   cert_file: "certs/tamper-server.crt"
  #   key_file: "certs/tamper-server.key"
  #
  # Message size limits, in bytes. Zero (the default) means tamper imposes
  # no limit of its own and lets client and target enforce theirs.
  # max_recv_msg_size: 0
  # max_send_msg_size: 0

# Side facing the upstream server: tamper is the client here.
target:
  addr: "localhost:50051"
  # Dial the target over TLS. Without this block the connection is plaintext.
  # tls:
  #   # Trust anchor for the target certificate; system roots when empty.
  #   ca_file: "certs/upstream-ca.crt"
  #   # Name checked against the target certificate, needed when dialing by IP.
  #   server_name: "api.example.com"
  #   # Skip that check entirely. Handy for self-signed staging certs, and a
  #   # hole in the connection's security everywhere else.
  #   insecure_skip_verify: false
  #   # Client certificate, only for targets that require mutual TLS.
  #   cert_file: "certs/tamper-client.crt"
  #   key_file: "certs/tamper-client.key"
  # max_recv_msg_size: 0
  # max_send_msg_size: 0

logger:
  level: "info"

rules:
  # Patterns follow path.Match: "*" fills one path segment and never crosses a
  # "/", so "/pkg.Service/*" is the whole service and "/*/Method" is that method
  # name in any service. A lone "*" matches every call. Rules that match the
  # same call all fire, in the order written here.
  #
  # Unknown keys are rejected: a typo is a broken rule, not a default.
  #
  # Faults come in two kinds. Call-level faults (delay, abort) act on the call
  # as a whole, before anything is forwarded. Message-level faults (truncate,
  # corrupt, drop) act on each message in flight, and take a direction:
  #   request   on the way to the target (the default)
  #   response  on the way back to the client
  #   both      on either leg
  # A direction on a call-level fault is an error.

  # Hold the call back before forwarding it. The name is optional and shows up
  # in the logs; without one the rule is reported as its type and position,
  # such as "delay-0".
  - match:
      method: "/pkg.Service/Method"
    fault:
      name: "slow-method"
      type: delay
      prob: 0.5
      duration: 500ms

  # Answer with a gRPC status instead of reaching the target at all. The code
  # is the numeric gRPC code: 13 is Internal, 14 Unavailable.
  - match:
      method: "/pkg.Service/Other"
    fault:
      type: abort
      code: 13
      msg: "injected error"
      prob: 1.0

  # Cut every request down to size bytes, which is what a receiver sees when a
  # connection dies mid-message: the frame arrives intact and the payload
  # inside it does not parse. A message already that short is left alone --
  # truncate never pads a message out to size.
  - match:
      method: "/pkg.Service/Upload"
    fault:
      type: truncate
      prob: 1.0
      direction: request
      size: 16

  # Damage count bytes of every answer, chosen at random, leaving the length
  # untouched. Decoding usually fails outright; when it does not, a field
  # quietly carries a different value. count defaults to 1.
  - match:
      method: "/pkg.Service/Fetch"
    fault:
      name: "damage-fetch"
      type: corrupt
      prob: 0.2
      direction: response
      count: 4

  # Swallow one message in ten, in either direction. Neither side is told:
  # the call stays healthy and the stream simply has a hole in it. On a unary
  # call a dropped message leaves the caller without an answer.
  - match:
      method: "/pkg.Service/Stream"
    fault:
      type: drop
      prob: 0.1
      direction: both

  # Anything under this service, with a small delay.
  - match:
      method: "/pkg.Service/*"
    fault:
      type: delay
      prob: 0.1
      duration: 50ms

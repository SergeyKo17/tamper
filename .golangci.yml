version: "2"

linters:
  default: none
  enable:
    - revive
    - errname
    - errcheck
    - unparam
    - nilerr
    - bodyclose
    - govet
    - staticcheck
    - gosec
    - misspell
    - exhaustive
    - gocyclo
    - noctx
    - godot
    - errorlint
  settings:
    errcheck:
      check-blank: true
    gocyclo:
      min-complexity: 15
    revive:
      rules:
        - name: exported
        - name: package-comments
          disabled: true
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - goimports